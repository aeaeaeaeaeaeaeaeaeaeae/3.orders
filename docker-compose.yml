services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      # -h 127.0.0.1: во время init-скриптов сервер слушает только сокет,
      # так что TCP-проверка проходит лишь после полной инициализации.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # docker compose --profile test run --rm tests
  tests:
    image: golang:1.26
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders_test?sslmode=disable
    command: go test ./... -count=1 -v
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gomod:
